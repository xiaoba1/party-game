name: party_game
description: 聚会游戏集 - 离线聚会游戏 App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  intl: ^0.19.0
  flutter_animate: ^4.5.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  web_socket_channel: ^3.0.1
  share_plus: ^10.1.2
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/punishments.json
    - assets/data/punishments_extra.json
    - assets/data/wheel_presets.json
    - assets/data/word_pairs_undercover.json
